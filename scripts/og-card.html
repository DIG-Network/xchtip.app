<!doctype html>
<!--
  Source for the xchtip.app social/OG card (1200x630). Rendered to public/og.png by
  scripts/gen-og.mjs (Playwright screenshot). Self-contained: inline styles + system-ish serif stack
  approximating Fraunces (the rasterizer has no network). Edit here, then re-run `node scripts/gen-og.mjs`.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      .card {
        width: 1200px; height: 630px; position: relative; overflow: hidden;
        background: #0b1512;
        background-image:
          radial-gradient(1100px 700px at 80% -10%, rgba(87,227,154,0.10), transparent 60%),
          radial-gradient(900px 600px at 2% 6%, rgba(245,182,66,0.10), transparent 55%);
        font-family: Georgia, "Times New Roman", serif;
        color: #eef4f0;
        display: flex; flex-direction: column; justify-content: center;
        padding: 76px 84px;
      }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
      .brand .heart { color: #f5b642; font-size: 34px; line-height: 1; }
      .brand .name { font-weight: 700; font-size: 30px; letter-spacing: .01em; }
      .brand .tld { color: #6f8880; font-weight: 500; }
      .kicker {
        font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 600;
        letter-spacing: .22em; text-transform: uppercase; color: #6f8880; margin-bottom: 22px;
      }
      h1 {
        font-size: 82px; line-height: 1.02; font-weight: 600; letter-spacing: -0.01em; max-width: 18ch;
      }
      h1 em { font-style: italic; color: #f5b642; }
      .sub {
        font-family: Inter, system-ui, sans-serif; font-size: 26px; color: #a6bcb3;
        margin-top: 30px; max-width: 30ch; line-height: 1.4;
      }
      /* the mock tip button — the product's thesis, in the corner */
      .btn {
        position: absolute; right: 84px; bottom: 84px;
        display: inline-flex; align-items: center; gap: 12px;
        font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 30px; color: #fff;
        padding: 22px 40px; border-radius: 999px;
        background: linear-gradient(135deg, #3ab54a 0%, #1f8f3a 100%);
        box-shadow: 0 18px 50px rgba(58,181,74,0.5), 0 2px 10px rgba(0,0,0,.4);
      }
      .btn .h { font-size: 28px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="heart">&#9829;</span>
        <span class="name">xchtip<span class="tld">.app</span></span>
      </div>
      <div class="kicker">Free &middot; on-chain &middot; no account</div>
      <h1>A tip button <em>worth showing off.</em></h1>
      <div class="sub">Embeddable Chia tip buttons for XCH or any CAT. Wallet to wallet.</div>
      <div class="btn"><span class="h">&#9829;</span> Tip in XCH</div>
    </div>
  </body>
</html>
