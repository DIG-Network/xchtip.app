name: ci

# PR-gated CI: lint, typecheck, unit tests + coverage gate, the production build, and the
# accessibility/SEO Playwright suite. Runs on every PR and on push to main so main never goes red
# silently. Never deploys — deploy.yml handles that.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: xchtip-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + unit + coverage + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: unit tests + coverage (gated ≥80%)
        run: npm run test:coverage
      - name: CloudFront viewer-request function regression tests (SPA fallback + /embed.txt)
        run: node --test terraform/cloudfront-function.test.mjs
      - name: build (SPA + SEO gate + WC projectId injection)
        run: npm run build
      - name: install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: a11y (axe / WCAG 2.2 AA) + SEO Playwright suite
        run: npm run test:a11y
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The two edge Lambdas (#221) are their own npm packages (not part of the root `src/` TS project —
  # tsconfig.app.json only includes `src`), so they get their own typecheck + smoke build here. The
  # smoke scripts exercise the BUILT bundle end-to-end (real satori/resvg render for og-image; a
  # stubbed-fetch index.html rewrite for jar-meta) with no AWS required.
  lambdas:
    name: og-image + jar-meta Lambdas (typecheck + smoke build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: og-image — typecheck + smoke
        working-directory: lambda/og-image
        run: |
          npm ci
          npm run typecheck
          npm run smoke
      - name: jar-meta — typecheck + smoke
        working-directory: lambda/jar-meta
        run: |
          npm ci
          npm run typecheck
          npm run smoke
